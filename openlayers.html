<html>
<head>
    <link rel="stylesheet" href="site.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.11.0/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.11.0/dist/ol.js"></script>

	<script language="javascript" src="js/utils_c.js"></script>
    <script language="javascript" src="js/simbology.js"></script>
    <script language="javascript" src="js/utils.js"></script>
    <script language="javascript" src="config.js"></script>



</head>
<body>
    <style>
      #map {width: 100%;height:100%;}
    </style>

    <div id="map"></div>
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer"></a>
      <div id="popup-content"></div>
    </div>
    <script>
            const WEBGL=false;

            const VectorLayer = WEBGL?ol.layer.WebGLVector:ol.layer.Vector;
            const HeatmapLayer = ol.layer.Heatmap;
            const VectorSource = ol.source.Vector;

    
            const OPACITY='80';

            let vectorSource;
            
    
        function clearOldData(){
            vectorSource.clear(true);
        }

        let v_map={
                getRange: function(){
                        const view = map.getView();
                        const extent3857 = view.calculateExtent(map.getSize());
                        return extent3857;
                },
                getWidth: ()=>{return document.getElementById('map').clientWidth},
                loadData: (ar,layer_name)=>{return loadGeoJsonDataArray(ar,layer_name);},
                cleanLayer: null
            }

        const coef2_=0.01; //Precision //4
        const getNewMap=(m_petition)=>getNewMapGenV(m_petition,v_map,coef2_); //16


        const updateResults=getUpdateResultsFunction(default_update_results);

        
        function loadGeoJsonDataArray(ar,layer_name){
            //console.log(layer_name+' loaded '+ar.length+' features');
            const geojsonFormat = new ol.format.GeoJSON();
            if(WEBGL) for(let f of ar){f.properties.color_rgba=hexToRgbaArray_OL(f.properties.color)}
            //console.log(ar);

            const features = geojsonFormat.readFeatures({type: 'FeatureCollection', name: layer_name, features:ar}); 
            console.log('Loading '+ar.length+' features into layer '+layer_name);
            vectorSource.addFeatures(features); 
        }



        function init_map(){ 
            // Elements that make up the popup.
            var popupContainer = document.getElementById('popup');
            var popupContent = document.getElementById('popup-content');
            var popupCloser = document.getElementById('popup-closer');

            // Create an overlay to anchor the popup to the map.
            var overlay = new ol.Overlay({
                element: popupContainer,
            });

            /**
             * Add a click handler to hide the popup.
             * @return {boolean} Don't follow the href.
             */
            popupCloser.onclick = function () {
                overlay.setPosition(undefined);
                popupCloser.blur();
                return false;
            };


            
            vectorSource=new VectorSource({
                features: []
            })


            // Capa vectorial
            const vectorLayer = new VectorLayer({
                source: vectorSource,
                style:WEBGL?{
                        'stroke-color': 'black',
                        'stroke-width': 1,
                        //'stroke-offset': -1,
                        'fill-color':  ['get', 'color_rgba']
                }: function(feature){ 
                        let e0={
                            fill: new ol.style.Fill({
                                color: '#'+feature.get('color')+OPACITY
                            }),
                            stroke: new ol.style.Stroke({
                                color: 'rgba(0, 0, 200, 0.3)', 
                                width: 3
                            })
                        };


                        if(LABEL) if(LABEL.length>0){
                            let config_text={
                                text: String(feature.get(LABEL) || ''),
                                font: '13px Calibri,sans-serif',
                                fill: new ol.style.Fill({
                                    color: '#000000',
                                }),
                                stroke: new ol.style.Stroke({
                                    color: '#ffffff',
                                    width: 3,
                                }),
                            };

                            const use_inline_labels=murl.indexOf('?rios')>0;
                            if(use_inline_labels){

                                    config_text={...config_text, 
                                        placement: 'line',
                                        maxAngle: Math.PI / 4,
                                        overflow: false, 
                                        repeat: 500,
                                    }
                                

                            }
                            e0.text=new ol.style.Text(config_text);
                        }

                        let resultStyle= new ol.style.Style(e0);
                        return resultStyle;

                    }
            });

            let baseLayer_source;

            if (url_params.get('base') == 'osm') {
                baseLayer_source = new ol.source.OSM();
            } else {
                baseLayer_source = new ol.source.XYZ({
                    url: base_layer,
                    attributions: baselayer_attribution
                });
            }                
            
            const baseLayer_ol=new ol.layer.Tile({
                source: baseLayer_source
            });
            

            map = new ol.Map({
                layers: [
                    baseLayer_ol,
                    vectorLayer //heatmap
                    //new ol.layer.Vector({ source })
                ],
                overlays: [overlay],
                target: 'map',
                view: new ol.View({
                    center: ol.proj.fromLonLat(initial_coordinates),
                    zoom: initial_zoom+1
                })
            });
            debug=map;

            // show the popup when clicking a feature
            map.on("click", function(e) {
                map.forEachFeatureAtPixel(e.pixel, function (feature, layer) {
                    //console.log(layer);
                    popupContent.innerHTML = fillTemplate('<h3>'+layer_data[0].CLICK_TEMPLATE+'</h3>', feature.values_);
                    overlay.setPosition(e.coordinate);
                })
            });

            map.on('moveend', updateResults);
            map.on('change:resolution', updateResults);

            updateResults();
        }
    
        document.addEventListener("DOMContentLoaded", async () => { init_map() });
        
        
        default_init(updateResults,clearOldData,true);


</script>
</body>
</html>
