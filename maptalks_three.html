<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MapTalks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/maptalks/dist/maptalks.css">

  <script type="text/javascript" src="https://unpkg.com/maptalks/dist/maptalks.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/three@0.104.0/examples/js/libs/stats.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/three@0.138.0/build/three.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/@maptalks/gl/dist/maptalksgl.js"></script>
  <script type="text/javascript" src="https://unpkg.com/maptalks.three/dist/maptalks.three.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/geojsondataset/dist/geojsondataset.js"></script>


    <script language="javascript" src="js/utils_c.js"></script>
    <script language="javascript" src="js/simbology.js"></script>
    <script language="javascript" src="js/utils.js"></script>
    <script language="javascript" src="config.js"></script>


  <style>
    html, body { margin: 0; height: 100%; width: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>

    const COLOR_TABLE=['ff0000','00ff00','0000ff','ffff00','00aaaa','aa00ff','00ffcc','aaaaaa','ffffff','33aa66','33aa66','33aa66'];
    const MAX_TEXTURES=COLOR_TABLE.length;


   var spatialReference = {
          'projection': 'EPSG:3857',
          'resolutions': (function () {
              const resolutions = [];
              const d = 2 * 6378137 * Math.PI;
              for (let i = 0; i < maxZoom; i++) {
                  resolutions[i] = d / (256 * Math.pow(2, i));
              }
              return resolutions;
          })(),
          'fullExtent': {
              'top': 6378137 * Math.PI,
              'left': -6378137 * Math.PI,
              'bottom': -6378137 * Math.PI,
              'right': 6378137 * Math.PI
          }
      };

    // Crear el mapa base
    map = new maptalks.Map('map', {
      center: initial_coordinates,
      spatialReference: spatialReference,
      zoom: initial_zoom,
      baseLayer: new maptalks.TileLayer('base', {
        urlTemplate: base_layer,
        subdomains: ['a', 'b', 'c', 'd']
      })
      
    });

    let geoDataSet;
    let threeLayer;
    const dataGroupId = layer_data[0].name;

    function clearOldData(){
        if (threeLayer) {
            threeLayer.clear();
        }        
    }
    
    function init_threejs(){
        geoDataSet = new geojsondataset.GeoDataSet({ coordinateCount: 100000, loopFPS: 2 });

        let total = 0;

        function process_color_table(i,features){
            const featureColor='#'+COLOR_TABLE[i];
            const material = new THREE.MeshBasicMaterial({ color: featureColor , transparent:true, opacity:0.9});
            const extrudeOptions = {
                    transparent:true,
                    asynchronous: true,
                    topColor: featureColor, 
                    lineColor: '#000000', // Color del borde: Negro
                    lineWidth: 1,         // Grosor del borde en píxeles
                    height: Math.ceil(Math.random(5)*10)+10,
                    opacity:0.9
                };
            const mesh = threeLayer.toExtrudePolygons(features, extrudeOptions, material);
            threeLayer.delayAddMesh(mesh);

        }

        geoDataSet.on(dataGroupId, (geojson) => {
          for(let i=0;i<=MAX_TEXTURES;i++)  {
            const filtered_features=geojson.features.filter(f=>f.properties.texture==i);
            //console.log('filtered_features',filtered_features);
            if(filtered_features.length>0) process_color_table(i,filtered_features); else console.log(i+' vacio');
          }
          total += geojson.coordinateCount;
          console.log('coordiantes count:', total);
        });

        // the ThreeLayer to draw buildings
        threeLayer = new maptalks.ThreeLayer('t', {
            identifyCountOnEvent: 1,
            // forceRenderOnMoving: true,
            // forceRenderOnRotating: true
        });
        var stats;

        threeLayer.prepareToDraw = function (gl, scene, camera) {
            stats = new Stats();
            stats.domElement.style.zIndex = 100;
            document.getElementById('map').appendChild(stats.domElement);
            var light = new THREE.DirectionalLight(0xffffff);
            light.position.set(0, -10, 10).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight('#fff', 0.5));
            animate();
            setTimeout(() => {
                updateResults();
            }, 100);

        };
        const sceneConfig = {
            postProcess: {
                enable: true,
                antialias: { enable: true }
            }
        };
        const groupLayer = new maptalks.GroupGLLayer('group', [threeLayer], { sceneConfig });
        groupLayer.addTo(map);

        function animate() {
            requestAnimationFrame(animate);
            stats.update();
            threeLayer.loop();
            threeLayer._needsUpdate = !threeLayer._needsUpdate;
            if (threeLayer._needsUpdate && !threeLayer.isRendering()) {
                threeLayer.redraw();
            }

        }

    }



    function drawData(json,color){
        
        let vectorLayer= new maptalks.VectorLayer('geojson-layer_'+vectorLayer_ar.length).addTo(map);
        vectorLayer_ar[vectorLayer_ar.length] = vectorLayer;

        const geometries = maptalks.GeoJSON.toGeometry(json);

        // Añadir geometrías a la capa vectorial
        vectorLayer.addGeometry(geometries);

        // Aplicar estilo básico
        geometries.forEach(g => {
          if (g instanceof maptalks.Marker) {
            g.updateSymbol({
              'markerType': 'ellipse',
              'markerFill': '#3388ff',
              'markerLineColor': '#fff',
              'markerWidth': 16,
              'markerHeight': 16
            });
          } else if (( g instanceof maptalks.MultiPolygon) || (g instanceof maptalks.Polygon)) {
            g.updateSymbol({
              'lineColor': '#3388ff',
              'lineWidth': 1,
              'polygonFill': '#'+g.properties.color, //+color
              'polygonOpacity': 0.4
            });
          } else if (( g instanceof maptalks.LineString) || (g instanceof maptalks.MultiLineString)) {
            g.updateSymbol({
              'lineColor': '#'+color,
              'lineWidth': 1,
            });
          } else console.log(g);
        });


        // Añadir eventos interactivos
        vectorLayer.on('click', e => {
          console.log('click');
          const props = e.geometry.getProperties();
          const name = props.name || 'Sin nombre';
          new maptalks.ui.InfoWindow({
            content: `<b>${name}</b><br>${JSON.stringify(props)}`,
            width: 200
          }).addTo(e.geometry).show(e.coordinate);
        });

        vectorLayer.on('mouseover', e => {
          e.geometry.updateSymbol({
            'markerFill': '#ff0000',
            'polygonFill': '#ff0000'
          });
        });

        vectorLayer.on('mouseout', e => {
          e.geometry.updateSymbol({
            'markerFill': '#3388ff',
            'polygonFill': '#3388ff'
          });
        });


    }
    

    function loadGeoJsonDataArray(ar){
            if(geoDataSet) geoDataSet.addGeoData(dataGroupId, {
                "type": "FeatureCollection",
                "features": ar
            });
        }      




    function getNewMap(m_petition){
            let range_=map.getPrjExtent(); 
            let range=[range_.xmin,range_.ymin,range_.xmax,range_.ymax];
            let screen_width=map.getContainer().clientWidth;
            getNewMapGen(m_petition,range,screen_width,null);
            
    }



    
    document.addEventListener("DOMContentLoaded", async () => { 
      //load_data();
      init_threejs();
      updateResults = getUpdateResultsFunction(default_update_results);
      map.on('zoomend moveend moving', updateResults);
      default_init(updateResults,clearOldData);
    });

</script>

</body>
</html>
