function getBoundingBox3857_(lng,lat) {
            let d=0.05;
			return [epsg4326ToEpsg3857([lng-d,lat-d]),epsg4326ToEpsg3857([lng+d,lat+d])].flatMap(x=>x);
}

function getBoundingBox3857(north,west,south,east) {
			return [epsg4326ToEpsg3857([north,west]),epsg4326ToEpsg3857([south,east])].flatMap(x=>x);

function getViewBoundingBox(viewer) {
    const scene = viewer.scene;
    const camera = scene.camera;
    const canvas = scene.canvas;

    // 1. Definir las esquinas de la pantalla
    // Coordenadas de pantalla (x, y) en píxeles.
    const screenCorners = [
        new Cesium.Cartesian2(0, 0),                        // Esquina superior izquierda
        new Cesium.Cartesian2(canvas.width, 0),             // Esquina superior derecha
        new Cesium.Cartesian2(0, canvas.height),            // Esquina inferior izquierda
        new Cesium.Cartesian2(canvas.width, canvas.height)  // Esquina inferior derecha
    ];

    // 2. Convertir las coordenadas de pantalla a coordenadas del mundo (Cartesian3)
    // El 'Ellipsoid' es el planeta.
    const cartesianCorners = [];
    for (const corner of screenCorners) {
        // Usa `pickEllipsoid` para obtener el punto en el elipsoide (globo).
        const cartesian = camera.pickEllipsoid(corner, scene.globe.ellipsoid);
        if (Cesium.defined(cartesian)) {
            cartesianCorners.push(cartesian);
        }
    }
    
    // 3. Crear el Cesium.Rectangle a partir de las coordenadas del mundo
    if (cartesianCorners.length > 0) {
        // `fromCartesianArray` calcula el rectángulo que abarca todos los puntos.
        return Cesium.Rectangle.fromCartesianArray(cartesianCorners, scene.globe.ellipsoid);
    }

    return undefined;
}


function clearOldData() {

function loadGeoJsonData(geojson){
        //delete geojson.crs;
        debug_data=geojson;
        let promise = Cesium.GeoJsonDataSource.load(geojson,options);
        promise.then(function(dataSource) {
            debug_dataSource=dataSource;
            viewer.dataSources.add(dataSource);
            //Cambiar colores
            const entities = dataSource.entities.values;
            for (let entity of entities) {
                        entity.polygon.material = Cesium.Color.fromCssColorString('#'+entity.properties.color).withAlpha(0.6);
            }            

        }).catch(function(error){
            console.error(error);
            console.error(': No se cumplio la promesa...');
        });

}

function loadGeoJsonDataArray(ar){
    let geojson={
        "type": "FeatureCollection",
        "features": ar
    };
    loadGeoJsonData(geojson);
}
