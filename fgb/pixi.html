<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="site.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/flatgeobuf@3.32.0/dist/flatgeobuf-geojson.min.js"></script>
    <script src="https://unpkg.com/json-formatter-js@2.5.23/dist/json-formatter.umd.js"></script>
	<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>-->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.1.0/pixi.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/leaflet-pixi-overlay@1.9.4/L.PixiOverlay.min.js"></script>
</head>
<body>
<style>
</style>
    <style>
        #map { height: 100%; }
    </style>
    <div id="map"></div>
    <script>
        document.addEventListener("DOMContentLoaded", async () => { 
            // basic OSM Leaflet map
            let map = L.map('map').setView([39, -98], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // optionally show some meta-data about the FGB file
            function handleHeaderMeta(headerMeta) {
                const header = document.getElementById('header')
                const formatter = new JSONFormatter(headerMeta, 10)
                header.appendChild(formatter.render())
            }

            const response = await fetch('UScounties.fgb');
            for await (let feature of flatgeobuf.deserialize(response.body, undefined, handleHeaderMeta)) {
                // Leaflet styling
                const defaultStyle = { 
                    color: 'blue', 
                    weight: 2, 
                    fillOpacity: 0.2,
                };

                // Add the feature to the map
				
				/*
				L.pixiOverlay(feature, {
                    style: defaultStyle
                }).addTo(map);
				*/
				
				const pixiOverlay = L.pixiOverlay((utils) => {
					// your drawing code here
				}, new PIXI.Container());
				pixiOverlay.addTo(map);
				
                /*
				L.geoJSON(feature, { 
                    style: defaultStyle 
                }).on({
                    // highlight on hover
                    'mouseover': function(e) {
                        const layer = e.target;
                        layer.setStyle({
                            color: 'blue',
                            weight: 4,
                            fillOpacity: 0.7,
                        });
                        layer.bringToFront();
                    },
                    // remove highlight when hover stops
                    'mouseout': function(e) {
                        const layer = e.target;
                        layer.setStyle(defaultStyle);
                    }
                })
                // show some per-feature properties when clicking on the feature
                .bindPopup(`<h1>${feature.properties["NAME"]} ${feature.properties["LSAD"]}, ${feature.properties["STATE"]}</h1>`)
                .addTo(map);
				*/
            }
        });
    </script>


    <div id="header">
        <h3>Parsed header content</h3>
    </div>
</body>
</html>
