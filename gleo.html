<head>

    }
  }

  <script language="javascript">
	
	const ZOOM_SPEED=2;
	const MINSPAN=3000;
	const opacity='aa';
	const lines_opacity='ff';
  const USE_STROKE=false;
  
  </script>

	<script language="javascript" src="js/utils_c.js"></script>
  <script language="javascript" src="js/simbology.js"></script>
	<script language="javascript" src="js/utils.js"></script>

</head>
<style>
  .gleo-balloon-body {
      min-width: 220px;      /* el ancho mínimo que tú quieras */
      width: max-content;     /* se ajusta al contenido... */
      max-width: 400px;       /* ...pero sin crecer descontroladamente */
      white-space: nowrap;    /* evita el salto de línea */
  }
</style>
<body >
   <div id="gleomap" style="display:block;height: 100vh;width:100%"></div>

  <script type="module">
  


    import MercatorMap   from "gleo/MercatorMap.mjs";
    import MercatorTiles from "gleo/loaders/MercatorTiles.mjs";
    import Geometry from 'gleo/geometry/Geometry.mjs';	
    import GeoJSON from "gleo/loaders/GeoJSON.mjs";
    import Fill from "gleo/symbols/Fill.mjs";
    import Stroke from "gleo/symbols/Stroke.mjs";
    import Balloon from "gleo/pin/Balloon.mjs";


  	import { setFactory, factory } from "gleo/geometry/DefaultGeometry.mjs";


    
    const map = new MercatorMap("gleomap", {
	  center: initial_coordinates.reverse(),
      span:   Math.pow(2,27-initial_zoom), //500000,
      maxSpan: 20e7,
	  minSpan: MINSPAN,
	  wheelPxPerZoomLog2: 1000/ZOOM_SPEED
    });
	


    
    new MercatorTiles(base_layer, {
      attribution: baselayer_attribution
    }).addTo(map);


    let currentBalloon; // para poder quitar el anterior

function change_color(color){
	return color.substring(0,2)+color.substring(4,6)+color.substring(2,4);
}

    let geojson=[];
    let map_width;

    function drawData(d,click_template){
      geojson.push(new GeoJSON(d, {
            polygonSymbolizer: function (feature, geom) {
                  const fill=new Fill(geom, {colour:'#'+feature.properties.color+opacity, cursor:'pointer',interactive:true});
                  fill.on('click', (ev) => {
                    let html=fillTemplate(click_template, feature.properties);
                    html='<div>'+html+'</div>';
                    console.log('html',html);
                    if (currentBalloon) currentBalloon.remove();

                    currentBalloon = new Balloon(ev.geometry,html).addTo(map);

                  });
                  if(USE_STROKE){
                    const stroke=new Stroke(geom, {colour:'#3333ee'+opacity, width:2})
                      
                    return [
                        stroke,
                        fill
                      ]

                  }
                  else
                  return [fill];
                      
              },
            lineSymbolizer: function (feature, geom) {
              return false?new Stroke(geom, {colour:'#2233ee'+lines_opacity, width:2}):new Stroke(geom, {colour:'#2233ee'+'11', width:8});
            }
        }).addTo(map)
        );	

    }

    function loadGeoJsonDataArray(ar,layer_name){
        //console.log(layer_name+' loaded '+ar.length+' features');
        let d=layer_data.filter(l=>l.name==layer_name)[0];    
        let click_template=d.CLICK_TEMPLATE;

        drawData({
            "type": "FeatureCollection",
            "features": ar
        },click_template);
    }


function clearOldData(){
  clearOldDataAUX(geojson);
}


let v_map={
  getRange: ()=>{let range_=map.bbox;let range=[range_.minX,range_.minY,range_.maxX,range_.maxY];return range;},
  getWidth: ()=>{return map.container.clientWidth;},
  loadData: (ar,layer_name)=>{return loadGeoJsonDataArray(ar,layer_name);},
  cleanLayer: null
}

function getNewMap(m_petition){
				getNewMapGenV(m_petition,v_map,8);
}


    let updateResults=getUpdateResultsFunction(default_update_results);
    debug=map;
    map.on('viewchanged',updateResults);
    
    default_init_multiworker2(updateResults,clearOldData,getNewMap);


  </script>
</body>
