<!--
	Mapa en CRS EPSG:4326 (Leaflet 2).
	Las tiles WMTS (IGN) siguen siendo EPSG:3857, por lo que el TileLayer
	se configura con su propio CRS para que la rejilla de tiles sea correcta.
-->

 <body>

<div id='map'></div>

<script type="module">
	import {LeafletMap, TileLayer, GeoJSON,LayerGroup,CRS} from 'leaflet';

    let previousResults={};
	let map;
    
    
	function highlightFeature(e) {
		const layer = e.target;

		layer.setStyle({
			weight: 5,
			color: '#33AA33',
			dashArray: '',
			fillOpacity: 0.7
		});

		layer.bringToFront();
	}

	function zoomToFeature(e) {
		map.fitBounds(e.target.getBounds());
	}

    function loadGeoJsonDataArray(geojsonFeatures,layer_name){
        let d=layer_data.filter(l=>l.name==layer_name)[0];    
        let click_template=d.CLICK_TEMPLATE;
        let color=d.color;

		function resetHighlight(e) {
			geojsonLayer.resetStyle(e.target);
		}


		const geojsonLayer = new GeoJSON(geojsonFeatures, {
            style(feature) {
                return {
                    color: '#'+feature.properties.color,
                    weight: 2,
                    opacity: 0.65,
					fillOpacity: 0.65
                };
            },

            onEachFeature(feature, layer) {
                if (feature.properties) {
                    layer.bindPopup(fillTemplate('<h3>'+click_template+'</h3>', feature.properties));
                }
				layer.on({
					pointerover: highlightFeature,
					pointerout: resetHighlight,
					click: zoomToFeature
				});

            }
        });


        if(!previousResults[layer_name]){
			previousResults[layer_name]=new LayerGroup().addTo(map);
		}
		geojsonLayer.addTo(previousResults[layer_name]); 
    }

    

    function getBoundingBox3857() {
        const b = map.getBounds();
        return [epsg4326ToEpsg3857([b.getWest(),b.getSouth()]),epsg4326ToEpsg3857([b.getEast(),b.getNorth()])].flatMap(x=>x);
		//return [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()];
    }

    function clearOldData(layer){
                console.log('clearOldData',layer);
				if(previousResults[layer]){
					previousResults[layer].remove();
					const nextResults = new LayerGroup().addTo(map);
					previousResults[layer] = nextResults;
				}
    }
    

	function cleanLayer(layer_name,zoom){
		console.log('Layer '+layer_name+' not in zoom range: '+zoom);
		clearOldData(layer_name);
	}

    
	let v_map={
		getRange: getBoundingBox3857,
		getWidth: ()=>{return map.getContainer().clientWidth},
		loadData: (ar,layer_name)=>{return loadGeoJsonDataArray(ar,layer_name);},
		cleanLayer: cleanLayer
	}

	const coef2_=0.01; //Precision
	const getNewMap=(m_petition)=>getNewMapGenV(m_petition,v_map,coef2_); //16


	function init_map(){
		map = new LeafletMap('map').setView(initial_coordinates.reverse(), initial_zoom+1);
		debug=map;

		const tiles = new TileLayer(base_layer, {
				maxZoom: maxZoom,
                minZoom: minZoom,
				attribution: baselayer_attribution,
				// Las tiles del WMTS son EPSG:3857; el mapa es EPSG:4326
				//crs: CRS.EPSG3857
		}).addTo(map);

	}

	document.addEventListener("DOMContentLoaded", async () => { 
		init_map();
		//const updateResults= getUpdateResultsFunction(null,100,false); //500
		const updateResults= default_update_results;

		map.on("moveend zoomend", updateResults); //move 
		default_init_multiworker2(updateResults,clearOldData,getNewMap);
	});


</script>
