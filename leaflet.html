    function loadFeature(feature,click_template){
                        // Leaflet styling
                        const defaultStyle = { 
                            color: '#' + feature.properties["color"], 
                            //color: '#00ee00', 
                            weight: 1, 
                            fillOpacity: 0.4,
                        };
                        //Etiquetado
                        L.geoJSON(feature, {
                            style: defaultStyle,
                        }).on({
                            'mouseover': function(e) {
                                const layer = e.target;
                                layer.setStyle({
                                    weight: 4,
                                    fillOpacity: 0.8,
                                });
                            },
                            'mouseout': function(e) {
                                const layer = e.target;
                                layer.setStyle(defaultStyle);
                            }
                    }).bindPopup(fillTemplate('<h3>'+click_template+'</h3>', feature.properties)).addTo(previousResults);
            }

    function loadGeoJsonDataArray(geojsonFeatures,layer_name){
        let d=layer_data.filter(l=>l.name==layer_name)[0];    
        let click_template=d.CLICK_TEMPLATE;
        let color=d.color;
        const geojsonLayer = L.geoJSON(geojsonFeatures, {
            // 🎨 Opciones de Estilo (solo para polígonos/líneas)
            style: function (feature) {
                return {
                    color: '#'+feature.properties.color,
                    weight: 2,
                    opacity: 0.85
                };
            },


            // 📝 Eventos y Popups (Función llamada por cada feature)
            onEachFeature: function (feature, layer) {
                if (feature.properties) {
                    // Vincula el contenido del popup
                    layer.bindPopup(fillTemplate('<h3>'+click_template+'</h3>', feature.properties));
                }
            }
        });

        // Finalmente, añade la capa al mapa
        geojsonLayer.addTo(previousResults); //map
    }

    

    function getBoundingBox3857() {
        const b = map.getBounds();
        return [epsg4326ToEpsg3857([b.getWest(),b.getSouth()]),epsg4326ToEpsg3857([b.getEast(),b.getNorth()])].flatMap(x=>x);
    }

    function clearOldData(){
                // remove the old results
                previousResults.remove();
                const nextResults = L.layerGroup().addTo(map);
                previousResults = nextResults;
    }

    function getNewMap(m_petition){
                    let range=getBoundingBox3857();

    // if the user is panning around alot, only update once per second max
    updateResults = debounce(default_update_results, 500); //throttle




    async function init_map(){
            // basic OSM Leaflet map
            map = L.map('map').setView(initial_coordinates.reverse(), initial_zoom);
            debug=map;
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: maxZoom,
                minZoom: minZoom,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);


            // track the previous results so we can remove them when adding new results
            previousResults = L.layerGroup().addTo(map);
            screen_width=map.getContainer().clientWidth;

            
            // ...and update the results whenever the map moves
            map.on("moveend zoomend", updateResults);
        };
    

        document.addEventListener("DOMContentLoaded", async () => { 
            init_map();
