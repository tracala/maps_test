<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor GIS</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .contenedor {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #0003;
        }

        h2 {
            margin-top: 0;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 11px;
            font-size: 16px;
            border: 0;
            border-radius: 4px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1565c0;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h2>Configuración del mapa</h2>

    <div class="campo">
        <label for="tipoMapa">Tipo de mapa</label>
        <select id="tipoMapa"></select>
    </div>

    <div class="campo">
        <label for="dato">Dato a presentar</label>
        <select id="dato"></select>
    </div>

    <button id="aceptar">Aceptar</button>

</div>

<script>

    // Opciones de los desplegables
    const tipos = "maplibre,maplibre_deckgl,cesium,openlayers,leaflet,maptalks,gleo,leaflet_pixi,maptalks_three,maptalks3d,deckgl".split(',');
    const datos = "gadm2,edificios_madrid,parroquias,secciones,siose,corine".split(',');


    // Rellenar desplegable de tipos
    const selectTipo = document.getElementById("tipoMapa");

    tipos.forEach(tipo => {

        const option = document.createElement("option");

        option.value = tipo;
        option.textContent = tipo;

        selectTipo.appendChild(option);
    });


    // Rellenar desplegable de datos
    const selectDato = document.getElementById("dato");

    datos.forEach(dato => {

        const option = document.createElement("option");

        option.value = dato;
        option.textContent = dato;

        selectDato.appendChild(option);
    });


    // Botón Aceptar
    document.getElementById("aceptar").onclick = function () {

        const tipo = selectTipo.value;
        const dato = selectDato.value;

        window.location.href =encodeURIComponent(tipo) + '.html?'+encodeURIComponent(dato);
    };



</script>

</body>
</html>
